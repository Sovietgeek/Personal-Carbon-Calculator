name: Staging - Build, Test & Verify

on:
  push:
    branches: [ staging ]
    paths:
      - 'ecoverse-backend/**'
      - 'ecoverse-frontend/**'
      - 'docker-compose.staging.yml'
      - '.github/workflows/staging.yml'
  workflow_dispatch:

# ⚠️ This workflow builds and tests for staging.
# It does NOT auto-deploy to production.
# Production deployment requires separate approval.

jobs:
  # ================================================================
  # Job 1: Build & Test
  # ================================================================
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecoverse-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ecoverse-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run all tests (including Testcontainers on Linux)
        run: ./mvnw clean test -DexcludedGroups=
        env:
          JWT_SECRET: ci-test-secret-key-that-is-at-least-64-bytes-long-for-hs512-algorithm-XXXXXX

      - name: Build application JAR
        if: success()
        run: ./mvnw clean package -DskipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: ecoverse-backend/target/surefire-reports/
          retention-days: 14

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-jar
          path: ecoverse-backend/target/*.jar
          retention-days: 7

  # ================================================================
  # Job 2: Build Docker Image
  # ================================================================
  build-docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-jar
          path: ecoverse-backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (staging)
        run: |
          docker build -t ecoverse-backend:staging-${{ github.sha }} .
          docker tag ecoverse-backend:staging-${{ github.sha }} ecoverse-backend:staging-latest
        working-directory: ecoverse-backend

      - name: Verify Docker image starts
        run: |
          # Start a temporary container and check health
          docker run -d --name staging-test \
            -e SPRING_PROFILES_ACTIVE=staging \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/ecoverse_staging \
            -e SPRING_DATASOURCE_USERNAME=ecoverse \
            -e SPRING_DATASOURCE_PASSWORD=test \
            -e JWT_SECRET=staging-test-secret-key-that-is-at-least-64-bytes-long-for-hs512 \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e APP_URL=http://localhost:3000 \
            -p 8082:8081 \
            ecoverse-backend:staging-${{ github.sha }}

          # Wait for startup (up to 60 seconds)
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            if docker exec staging-test curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "Container is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Container did not become healthy in time"
              docker logs staging-test
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          # Stop and remove
          docker stop staging-test
          docker rm staging-test

  # ================================================================
  # Job 3: Staging Smoke Tests
  # ================================================================
  staging-smoke:
    runs-on: ubuntu-latest
    needs: build-docker

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecoverse_staging
          POSTGRES_USER: ecoverse
          POSTGRES_PASSWORD: staging_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-jar
          path: ecoverse-backend/target/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run application in background
        run: |
          cd ecoverse-backend
          java -jar target/*.jar \
            --spring.profiles.active=staging \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/ecoverse_staging \
            --spring.datasource.username=ecoverse \
            --spring.datasource.password=staging_test_password \
            --ecoverse.jwt.secret=staging-smoke-test-secret-key-that-is-at-least-64-bytes-long-for-hs512-algorithm \
            --ecoverse.cors.allowed-origins=http://localhost:3000 \
            --ecoverse.app.url=http://localhost:3000 \
            --server.port=8081 \
            &
          echo "Waiting for application to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "Application is UP!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Application did not start in time"
              exit 1
            fi
            sleep 2
          done

      - name: Smoke test - Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: $STATUS"
            exit 1
          fi
          echo "✅ Health check: $STATUS"

      - name: Smoke test - Register
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8081/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Smoke Test","email":"smoke@test.com","password":"TestPass123!","country":"IN"}')
          if [ "$STATUS" != "200" ]; then
            echo "Registration failed: $STATUS"
            exit 1
          fi
          echo "✅ Registration: $STATUS"

      - name: Smoke test - Login
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8081/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"TestPass123!"}')
          if [ "$STATUS" != "200" ]; then
            echo "Login failed: $STATUS"
            exit 1
          fi
          echo "✅ Login: $STATUS"

      - name: Smoke test - Product listing
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/shop/products?page=0&size=5)
          echo "✅ Product listing: $STATUS"

      - name: Smoke test - Webhook endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8081/api/payments/webhook \
            -H "Content-Type: application/json" \
            -d '{"event":"test"}')
          if [ "$STATUS" != "200" ]; then
            echo "Webhook endpoint unexpected status: $STATUS"
            exit 1
          fi
          echo "✅ Webhook endpoint: $STATUS"

  # ================================================================
  # Job 4: Report
  # ================================================================
  staging-report:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker, staging-smoke]
    if: always()

    steps:
      - name: Staging Pipeline Report
        run: |
          echo "============================================"
          echo "  Staging Pipeline Report"
          echo "============================================"
          echo "  Commit: ${{ github.sha }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Build:  ${{ needs.build-and-test.result }}"
          echo "  Docker: ${{ needs.build-docker.result }}"
          echo "  Smoke:  ${{ needs.staging-smoke.result }}"
          echo "============================================"
          echo ""
          if [ "${{ needs.build-and-test.result }}" = "failure" ] || \
             [ "${{ needs.build-docker.result }}" = "failure" ] || \
             [ "${{ needs.staging-smoke.result }}" = "failure" ]; then
            echo "❌ Staging pipeline FAILED — do not deploy"
            exit 1
          else
            echo "✅ Staging pipeline PASSED — ready for manual deployment"
          fi
