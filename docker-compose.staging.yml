# ================================================================
# EcoVerse — Staging Docker Compose
# Run: docker compose -f docker-compose.staging.yml up -d
#
# Staging environment: separate database, separate secrets,
# production-like configuration but NOT production.
#
# IMPORTANT: Never use production secrets here.
# All secrets come from .env.staging (gitignored).
# ================================================================

services:
  # PostgreSQL Database (staging-specific)
  db:
    image: postgres:16-alpine
    container_name: ecoverse-staging-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoverse_staging}
      POSTGRES_USER: ${POSTGRES_USER:-ecoverse_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoverse_staging} -d ${POSTGRES_DB:-ecoverse_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ecoverse-staging-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Backend API (staging profile)
  backend:
    build:
      context: ./ecoverse-backend
      dockerfile: Dockerfile
    container_name: ecoverse-staging-backend
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - SERVER_FORWARD_HEADERS_STRATEGY=FRAMEWORK
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-ecoverse_staging}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-ecoverse_staging}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - DATABASE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-ecoverse_staging}
      - DB_USERNAME=${POSTGRES_USER:-ecoverse_staging}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env.staging}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set — use staging ngrok URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dummy-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-dummy-secret}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - RAZORPAY_MODE=${RAZORPAY_MODE:-test}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@ecoverse.app}
      - APP_URL=${APP_URL:?APP_URL must be set — use staging ngrok URL}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
    ports:
      - "${BACKEND_PORT:-8082}:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ecoverse-staging-network
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  staging_postgres_data:

networks:
  ecoverse-staging-network:
    driver: bridge
