# ==============================================================
# Test Profile — External PostgreSQL (for local Docker Compose)
# Used when Testcontainers is unavailable (e.g., Windows Docker Desktop)
# Start PostgreSQL first: docker compose up -d db
# Then run: mvn test -Dspring.profiles.active=testpg
# ==============================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecoverse
    driver-class-name: org.postgresql.Driver
    username: ecoverse
    password: ecoverse123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-that-is-at-least-64-bytes-long-for-hs512-algorithm-testing-XXXXXX

razorpay:
  mode: test
